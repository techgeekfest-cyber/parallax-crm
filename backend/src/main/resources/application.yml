# ParallaxCRM backend configuration.
# Database settings are provider-agnostic (ADR 0003): the same three variables point at
# local Docker PostgreSQL or Neon. The `local` profile (default) supplies values for Docker Compose.
spring:
  application:
    name: parallaxcrm
  profiles:
    default: local
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:5}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  threads:
    virtual:
      enabled: true
  session:
    timeout: 8h
    jdbc:
      initialize-schema: never
      cleanup-cron: "0 */5 * * * *"
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: true

info:
  app:
    name: ParallaxCRM
    description: Enterprise Customer Relationship Platform

springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:true}
  swagger-ui:
    enabled: ${OPENAPI_ENABLED:true}
  paths-to-match: /api/**
  default-produces-media-type: application/json

parallax:
  security:
    # Secure flag on the session and CSRF cookies. Only plain-http local development turns it off.
    secure-cookies: ${SESSION_COOKIE_SECURE:true}
    # Consecutive failed sign-ins per email before a temporary lock-out.
    max-failed-logins: 5
    login-lockout: 15m
  bootstrap:
    # Creates the first ADMIN only when the users table is empty and both values are set.
    admin-email: ${ADMIN_BOOTSTRAP_EMAIL:}
    admin-password: ${ADMIN_BOOTSTRAP_PASSWORD:}
