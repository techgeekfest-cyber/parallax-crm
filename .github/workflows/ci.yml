name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend · tests (Testcontainers PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Build and test
        run: ./mvnw -B verify

  frontend:
    name: Frontend · lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end · Next.js → Spring Boot → PostgreSQL
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: parallaxcrm
          POSTGRES_USER: parallax
          POSTGRES_PASSWORD: parallax
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U parallax -d parallaxcrm"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: jdbc:postgresql://localhost:5432/parallaxcrm
      DATABASE_USERNAME: parallax
      DATABASE_PASSWORD: parallax
      OPENAPI_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Start backend against an empty database
        working-directory: backend
        run: |
          ./mvnw -B -q package -DskipTests
          SPRING_PROFILES_ACTIVE=prod nohup java -jar target/parallaxcrm-backend-*.jar > backend.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:8080/actuator/health && exit 0; sleep 2; done
          cat backend.log; exit 1

      - name: Install frontend
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: API contract is up to date
        working-directory: frontend
        run: |
          npm run api:types
          git diff --exit-code -- src/lib/api/schema.d.ts || {
            echo "::error::src/lib/api/schema.d.ts is out of date. Run 'npm run api:types' with the backend running and commit the result."
            exit 1
          }

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          BACKEND_URL: http://localhost:8080

      - name: Playwright
        working-directory: frontend
        run: npx playwright test
        env:
          E2E_FRESH_DB: "1"
          BACKEND_URL: http://localhost:8080

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

      - name: Backend log
        if: failure()
        run: cat backend/backend.log
